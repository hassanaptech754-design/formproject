<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Admission Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5 mb-5">
<div class="row justify-content-center">
<div class="col-lg-9 col-md-10">

<div class="admission-card shadow-lg">

<div class="header text-center">
<h2>🎓 Online College Admission Portal</h2>
<p>Fill all details carefully before submitting</p>
</div>

<div class="card-body p-4">

<form id="admissionForm">

<h5 class="section-title">📌 Personal Details</h5>
<hr>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Full Name</label>
<input type="text" id="name" class="form-control">
<small class="error" id="nameError"></small>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email Address</label>
<input type="email" id="email" class="form-control">
<small class="error" id="emailError"></small>
</div>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Phone Number</label>
<input type="text" id="phone" class="form-control" placeholder="10 digit number">
<small class="error" id="phoneError"></small>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Date of Birth</label>
<input type="date" id="dob" class="form-control">
<small class="error" id="dobError"></small>
</div>
</div>

<div class="mb-3">
<label class="form-label">Gender</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female" class="ms-3"> Female
<small class="error d-block" id="genderError"></small>
</div>

<h5 class="section-title mt-4">📚 Academic Details</h5>
<hr>

<div class="mb-3">
<label class="form-label">Select Course</label>
<select id="course" class="form-control">
<option value="">Choose Course</option>
<option>Computer Science</option>
<option>Business Management</option>
<option>Engineering</option>
<option>Medical</option>
<option>Arts</option>
</select>
<small class="error" id="courseError"></small>
</div>

<div class="mb-3">
<label class="form-label">Permanent Address</label>
<textarea id="address" class="form-control" rows="3"></textarea>
<small class="error" id="addressError"></small>
</div>

<div class="mb-3">
<label class="form-label">Upload Passport Photo</label>
<input type="file" id="photo" class="form-control">
<small class="error" id="photoError"></small>
</div>

<button type="submit" class="btn btn-submit w-100 mt-3">
Submit Application
</button>

</form>

<h5 class="success text-center mt-3" id="successMsg"></h5>

</div>
</div>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
